server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    # Mặc định chạy LOCAL: dùng localhost
    # Khi chạy trong Docker: sẽ bị override bằng biến môi trường SPRING_DATASOURCE_URL
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ChatMe}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}

  servlet:
    multipart:
      enabled: true
      max-file-size: 2000MB
      max-request-size: 2000MB
      file-size-threshold: 2KB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      # LOCAL: dùng localhost:6379
      # Docker: sẽ override bằng SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 630173321423-arejn20gun74igit3bvfo0er6q5889jd.apps.googleusercontent.com
            client-secret: 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
            redirect-uri: http://localhost:3000/oauth2/callback/google
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

